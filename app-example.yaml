runtime: python38

# This should be populated and renamed to app.yaml (never added to git)

env_variables:
  DJANGO_SECRET_KEY: 123456
  YEASTPHENOME_DOWNLOAD_PREFIX: yeastphenome
  GOOGLE_ANALYTICS_SITE:
  GOOGLE_ANALYTICS_ID:
  TWITTER_USERNAME: calico
  INSTAGRAM_USERNAME:
  FACEBOOK_USERNAME:
  HELP_CONTACT_EMAIL: email@domain.com
  GITHUB_REPOSITORY: https://github.com/yeastphenome/yeastphenome.org
  GITHUB_DOCUMENTATION: https://yeastphenome.github.io/yeastphenome.org
  ENTREZ_EMAIL: email@domain.com
  DOMAIN_NAME: https://<app-name>-01.uc.r.appspot.com
  DEBUG: false

  # For cloud managed sql (postgresql)
  APP_ENGINE_CONNECTION_NAME:
  APP_ENGINE_USERNAME: 
  APP_ENGINE_PASSWORD: 
  APP_ENGINE_DATABASE: 

inbound_services:
- warmup

handlers:
# This configures Google App Engine to serve the files in the app's static
# directory.
- url: /static
  static_dir: static/

# This handler routes all requests not caught above to your main app. It is
# required when static routes are defined, but can be omitted (along with
# the entire handlers section) when there are no static files defined.
- url: /.*
  script: auto

automatic_scaling:
  min_idle_instances: 1
