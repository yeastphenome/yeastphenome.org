{% extends "base/base_min.html" %}
{% load static %}
{% load my_filters %}
{% block title %}{{ SITE_NAME }}{% endblock %}
{% block content %}

    <div class="row mt-5 mb-3">
        <div class="col-md-12">
            <span class="badge rounded-pill bg-secondary">Genes</span>
            <a href="{% url 'genes:detail' gene.id %}"><span class="badge rounded-pill bg-primary">{{ gene }}</span></a>
        </div>
    </div>

    <div class="row mt-5 mb-3">
        <div class="col-md-12">
            <h1>Compare genes</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <strong>x-axis:</strong> <a href="{% url 'genes:detail' gene.id %}">{{ gene }}</a>
            <br><strong>y-axis:</strong> <a href="{%  url 'genes:detail' gene2.id %}">{{ gene2 }}</a>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12 d-flex justify-content-center">
            {{ graph|safe }}
        </div>
    </div>
{% endblock %}
