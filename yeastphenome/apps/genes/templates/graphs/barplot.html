{% load my_filters %}

<script src="https://d3js.org/d3.v3.min.js"></script>
<script>

{% if template == "sims" %}
function draw_table(names) {
    $("#similar_table_body").empty()
    $("#similar_table").DataTable().destroy();

    content = ""
    $.each(names, function(i,e){

        // Grab the value and pvalue
        gene_value = gene_lookup[e].score || ""
        gene_name = gene_lookup[e].name || "Dataset id: " + e
        gene_pvalue = gene_lookup[e].pvalue || ""
        gene_rank = gene_lookup[e].rank || ""
        content += "<tr id='tr-" + e + "'><td class='dt-center' id='td-" + e + "'><a href='/genes/"+ e + "'>" + gene_name + "</a></td><td class='dt-center'>" + gene_value + "</td><td class='dt-center'>" + gene_pvalue + "</td><td class='dt-center'>"+ gene_rank + "</td><td class='dt-center'><a href='/genes/{{ gene.id }}/similar/scatterplot/" + e + "/'>Scatter plot</a></td></tr>\n"
    })

    $("#similar_table_body").html(content)
    $("#similar_table").show();
    $("#similar_table").dataTable({"pageLength": 10, "language": {"search": "Filter:"}, "drawCallback": addCallback,
        "columnDefs": [
            {"className": "dt-center", "targets": "_all"}
        ]
    });
    if (names.length != genes.length) {
        $("#similar_table_length").append('<a id="reset-selection" style="margin-left:10px" onclick="restore_original()" type="button" class="btn btn-pink">Reset selection</a>')
    }
}

var genes = [{% for entry in sims %}{"gene_id": "{{ entry.gene2.id }}", "name": "{{ entry.gene2 }}", "score": {{ entry.score|stringformat:".2f" }}, "pvalue": {{ entry.pvalue|stringformat:".2f" }}, "rank": "{{ ranks|lookup:forloop.counter0|floatformat:1 }}%" }{% if forloop.last %}{% else %},{% endif %}{% endfor %}]
var values = [{% for entry in sims %}{{ entry.score|stringformat:".2f" }}{% if forloop.last %}{% else %},{% endif %}{% endfor %}]

{% elif template == "scores" %}
function draw_table(names) {
    $("#similar_table_body").empty()
    $("#similar_table").DataTable().destroy();

    content = ""
    $.each(names, function(i,e){

        // Grab the value and pvalue
        gene_value = gene_lookup[e].score || ""
        gene_name = gene_lookup[e].name || "Dataset id: " + e
        gene_pvalue = gene_lookup[e].pvalue || ""
        gene_rank = gene_lookup[e].rank || ""
        content += "<tr id='tr-" + e + "'><td class='dt-center' id='td-" + e + "'><a href='/genes/"+ e + "'>" + gene_name + "</a></td><td class='dt-center'>" + gene_value + "</td><td class='dt-center'>" + gene_pvalue + "</td><td class='dt-center'>"+ gene_rank + "</td></tr>\n"
    })

    $("#similar_table_body").html(content)
    $("#similar_table").show();
    $("#similar_table").dataTable({"pageLength": 10, "language": {"search": "Filter:"}, "drawCallback": addCallback,
        "columnDefs": [
            {"className": "dt-center", "targets": "_all"}
        ]
    });
    if (names.length != genes.length) {
        $("#similar_table_length").append('<a id="reset-selection" style="margin-left:10px" onclick="restore_original()" type="button" class="btn btn-pink">Reset selection</a>')
    }
}

var genes = [{% for entry in sims %}{"gene_id": "{{ entry.gene2.id }}", "name": "{{ entry.gene2 }}", "score": {{ entry.score|stringformat:".2f" }}, "pvalue": {{ entry.pvalue|stringformat:".2f" }}, "rank": "{{ ranks|lookup:forloop.counter0|floatformat:1 }}%" }{% if forloop.last %}{% else %},{% endif %}{% endfor %}]
var values = [{% for entry in sims %}{{ entry.score|stringformat:".2f" }}{% if forloop.last %}{% else %},{% endif %}{% endfor %}]
{% elif template == "scores" %}

{% endif %}

// Restore original, full table
function restore_original() {

     // Restore colors to original values
     $.each($(".histbar"), function(i, e){
       $(e).attr("fill", $(e).attr("data-fill"));
     })

    // Dataset ids
    var names = genes.map(function(record){return record.gene_id; });
    draw_table(names)
}

var color = "steelblue";

// Get min and max
max_value = d3.max(values)
min_value = d3.min(values)

// A formatter for counts.
var formatCount = d3.format(",.0f");

var margin = {top: 40, right: 30, bottom: 50, left: 30},
    width = 960 - margin.left - margin.right,
    height = 300 - margin.top - margin.bottom;

var x = d3.scale.linear()
      .domain([min_value, max_value])
      .range([0, width]);

// Generate a histogram using twenty uniformly-spaced bins.
var data = d3.layout.histogram()
    .bins(x.ticks(20))
    (values);

// Create a lookup by bin id to index into count
var lookup = Object()
$.each(data, function(i, e){

    // If it's the first bin, include all left values
    if (i == 0){
        var filtered = genes.filter(function(record){return record.score < e.x + e.dx });
    // If we are in the last bin, we have to include all values
    } else if (i == data.length - 1) {
        var filtered = genes.filter(function(record){return record.score >= e.x });
    } else {
        var filtered = genes.filter(function(record){return e.x <= record.score && record.score < e.x + e.dx; });
    }
    $.each(filtered, function(ii, ee){
        lookup[ee.gene_id] = i
    })
})


// Lookup of value by dataset
var gene_lookup = Object()
var gene_id_lookup = Object()
$.each(genes, function(i, e){
    gene_lookup[e.gene_id] = e
    gene_id_lookup[e.name] = e.gene_id
})


var yMax = d3.max(data, function(d){return d.length});
var yMin = d3.min(data, function(d){return d.length});
var colorScale = d3.scale.linear()
            .domain([yMin, yMax])
            .range([d3.rgb(color).brighter(), d3.rgb(color).darker()]);

var y = d3.scale.linear()
    .domain([0, yMax])
    .range([height, 0]);

var xAxis = d3.svg.axis()
    .scale(x)
    .orient("bottom");

var svg = d3.select("#gene_plot").append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

var bar = svg.selectAll(".bar")
    .data(data)
  .enter().append("g")
    .attr("class", "bar")
    .attr("transform", function(d) { return "translate(" + x(d.x) + "," + y(d.y) + ")"; });

update_plot = function(d, i) {

    // If it's already selected, unselect and restore original table
    var bar = $("#histbar-" + i);
    var color = bar.attr("fill")

    // Restore colors to original values
    $.each($(".histbar"), function(i, e){
      $(e).attr("fill", $(e).attr("data-fill"));
    })

    // Case 1, unset filter
    if (color == "lightpink"){
        $("tr").removeClass('highlight');
        restore_original()
        return
    }

    // Then make selected red!
    bar.attr("fill", "lightpink");

    // If it's the first bin, include all left values
    if (i == 0){
        var ds = genes.filter(function(record){return record.score < d.x + d.dx });
    // If we are in the last bin, we have to include all values
    } else if (i == data.length - 1) {
        var ds = genes.filter(function(record){return record.score >= d.x });
    } else {
        var ds = genes.filter(function(record){return d.x <= record.score && record.score < d.x + d.dx; });
    }

    // Gene id
    var names = ds.map(function(record){return record.gene_id; });
    draw_table(names);
}

// Visible Bar
bar.append("rect")
    .attr("x", 1)
    .attr("id", function(d, i) { return "histbar-" + i; })
    .attr("width", (x(data[0].dx) - x(0)) - 1)
    .attr("class", "histbar")
    .attr("height", function(d) { return height - y(d.y); })
    .attr("data-fill", function(d) { return colorScale(d.y) })
    .attr("data-min", function(d) { return (d.x).toFixed(2) })
    .attr("data-max", function(d) { return (d.x + d.dx).toFixed(2) })
    .attr("fill", function(d) { return colorScale(d.y) })
    .on('click', function(d, i){update_plot(d, i)});

bar.append("text")
    .attr("dy", ".75em")
    .style("font-size", "12px")
    .attr("y", -12)
    .attr("x", (x(data[0].dx) - x(0)) / 2)
    .attr("text-anchor", "middle")
    .text(function(d) { return formatCount(d.y); });

// Invisible Bar
var cols = svg.selectAll(".t")
    .data(data)
   .enter().append("g")
    .attr("transform", function(d) { return "translate(" + x(d.x) + ")"; })
  .append('rect')
   .attr('class', 't')
   .attr("id", function(d, i) { return "histcol-" + i; })
   .attr("x", 1)
   .attr("width", (x(data[0].dx) - x(0)) - 1)
   .attr("height", function(d) { return height })
   .on('click', function(d, i){update_plot(d, i)});

// Show that the area is clickable
d3.selectAll('.t').on("mouseover", function(d, i) {
    d3.selectAll('rect#histcol-' + i)
       .classed("hovered", true)
    })
    .on("mouseout", function() {
        d3.selectAll('.hovered')
        .classed("hovered", false);
    });

svg.append("g")
    .attr("class", "x axis .xaxis")
    .style("font-size", "12px")
    .attr("transform", "translate(0," + height + ")")
    .call(xAxis);

svg.append("text")
    .attr("text-anchor", "end")
    .style("font-size", "12px")
    .attr("x", width)
    .attr("y", height + 35)
    .text("Correlation");

svg.append("text")
    .attr("text-anchor", "end")
    .style("font-size", "12px")
    .attr("y", 6)
    .attr("dy", ".75em")
    .attr("transform", "rotate(-90)")
    .text("Number of genes");


function doSearch(rowId) {

  // rowId looks like "tr-12345"
  var dataset_id = rowId.split("-")[1]

  console.log(dataset_id);

  // Get the bar for the gene from the lookup
  if (dataset_id in lookup) {
      var bar_id = lookup[dataset_id];

      // Restore colors to original values
      $.each($(".histbar"), function(i, e){
         $(e).attr("fill", $(e).attr("data-fill"));
      })

      $("tr").removeClass('highlight');
      $("#" + rowId).addClass('highlight');

      // Then make selected red!
      var bar = $("#histbar-" + bar_id);
      bar.attr("fill", "lightpink");

      // Add the button to reset the filter
      if ($("#reset-selection").length == 0) {
          $("#similar_table_length").append('<a id="reset-selection" style="margin-left:10px" onclick="restore_original()" type="button" class="btn btn-pink">Reset selection</a>')
      }
  } 
}

function addCallback() {
    table = $("#similar_table").DataTable();

    // Add callback on row click
    $("tr").off("click")
    $('tr').click(function(){
        var rowdata = table.row(this).data();
        var row_id = rowdata.DT_RowId
        doSearch(row_id);
    });
}
</script>
