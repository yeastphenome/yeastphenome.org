<script>
var color = "steelblue";

// Generate a 1000 data points using normal distribution with mean=20, deviation=5
//var values = d3.range(1000).map(d3.random.normal(20, 5));
// var values = [{% for gene in dataset_genes %}{{ gene.value }}{% if forloop.last %}{% else %},{% endif %}{% endfor %}]
var gene_values = {{ dataset_genes | safe }}

// parse aliases and common names into list
var aliases = {}
var _aliases = [{% for alias in aliases %}["{{ alias.0 }}", "{{ alias.1 }}"] {% if forloop.last %}{% else %},{% endif %}{% endfor %} ]
var aliases_lookup = { {% for alias in aliases %}"{{ alias.1 }}": "{{ alias.0 }}"{% if forloop.last %}{% else %},{% endif %}{% endfor %} }
$.each(_aliases, function(i, alias){
    if (!(alias[0] in aliases)) {
        aliases[alias[0]] = []
    } 
    aliases[alias[0]].push(alias[1]);
})

var common_names = {}
var _common_names = [{% for alias in common_names %}["{{ alias.0 }}", "{{ alias.1 }}"] {% if forloop.last %}{% else %},{% endif %}{% endfor %} ]
var common_names_lookup = { {% for alias in common_names %}"{{ alias.1 }}": "{{ alias.0 }}" {% if forloop.last %}{% else %},{% endif %}{% endfor %} }
$.each(_common_names, function(i, alias){
    if (!(alias[0] in common_names)) {
        common_names[alias[0]] = []
    } 
    common_names[alias[0]].push(alias[1]);
})

var values = gene_values.map(function(d){return d.value;})

// A formatter for counts.
var formatCount = d3.format(",.0f");

var margin = {top: 40, right: 30, bottom: 30, left: 30},
    width = 960 - margin.left - margin.right,
    height = 300 - margin.top - margin.bottom;

// Create a lookup by bin id
var lookup = Object()
var counts = Object()
$.each(gene_values, function(i, e){
    lookup[e.label] = e.value
    if (!(e.value in counts)) {
         counts[parseInt(e.value)] = 0
    }
    counts[parseInt(e.value)] += 1     
})

console.log(lookup);
console.log(counts);

// Create data array
var data = Array()
$.each(counts, function(i, e){
    data.push({"count": e,"value": parseInt(i)})
})
console.log(data)
data.sort((a, b) => (a.value < b.value))

var yMax = d3.max(data, function(d){return d.value});
var yMin = d3.min(data, function(d){return d.value});
var colorScale = d3.scale.linear()
            .domain([yMin, yMax])
            .range([d3.rgb(color).brighter(), d3.rgb(color).darker()]);

// A formatter for counts.
var formatCount = d3.format(",.0f");

var margin = {top: 40, right: 30, bottom: 30, left: 30},
    width = 960 - margin.left - margin.right,
    height = 300 - margin.top - margin.bottom;

var margin = {top: 20, right: 20, bottom: 70, left: 40},
    width = 600 - margin.left - margin.right,
    height = 300 - margin.top - margin.bottom;

var x = d3.scale.ordinal().rangeRoundBands([0, width], .05);
var y = d3.scale.linear().range([height, 0]);

var xAxis = d3.svg.axis()
    .scale(x)
    .orient("bottom");

var yAxis = d3.svg.axis()
    .scale(y)
    .orient("left")
    .ticks(10);

var svg = d3.select("#dataset-genes").append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", 
          "translate(" + margin.left + "," + margin.top + ")");
	
  x.domain(data.map(function(d) { return d.value; }));
  y.domain([0, d3.max(data, function(d) { return d.count; })]);

  svg.append("g")
      .attr("class", "x axis")
      .attr("transform", "translate(0," + height + ")")
      .call(xAxis)
    .selectAll("text")
      .style("text-anchor", "end")
      .attr("dx", "-.8em")
      .attr("dy", "-.55em")
      .attr("transform", "rotate(-90)" );

  svg.append("g")
      .attr("class", "y axis")
      .call(yAxis)
    .append("text")
      .attr("transform", "rotate(-90)")
      .attr("y", 6)
      .attr("dy", ".71em")
      .style("text-anchor", "end")
      .text("Count");

svg.selectAll(".bar")
    .data(data)
  .enter().append("rect")
      .style('cursor', 'pointer')
      .attr("fill", "steelblue")
      .attr("data-fill", "steelblue")
      .attr("id", function(d, i) { return "histbar-" + i; })
      .attr("data-value", function(d, i) { return d.value; })
      .attr("class", function(d, i) { return "histbar value-" + d.value; })
      .attr("x", function(d) { return x(d.value); })
      .attr("width", x.rangeBand())
      .attr("y", function(d) { return y(d.count); })
      .attr("height", function(d) { return height - y(d.count); })
      .on('click', function(d, i){ 

       // Restore colors to original values
       $.each($(".histbar"), function(i, e){
         $(e).attr("fill", $(e).attr("data-fill"));
       })

       // Then make selected red!
       var bar = $("#histbar-" + i);
       bar.attr("fill", "red");
       var bar_value = bar.attr("data-value");

       var genes = gene_values.filter(function(record){ return d.value == record.value; })
       var names = genes.map(function(record){return record.label; });

       content = "<h2> Bar with value " + bar_value + "</h2><div style='width:200px; height:200px; overflow:scroll;' class='custom-select typehead'><ul>"
       $.each(names, function(i,e){

           // If we have aliases and common names, add them too
           has_aliases = false
           if (e in common_names) {
               $.each(common_names[e], function(ii,ee){
                   content = content + "<a href='/datasets/genes?q="+ e + "'><li value=" + e + ">" + e + " / " + ee + "</li></a>"
               })
               has_aliases = true
           }

           // Only add the gene if it doesn't have aliases
           if (!has_aliases){
               content = content + "<a href='/datasets/genes?q="+ e+ "'><li value=" + e + ">" + e + "</li></a>"
           }

       })
       
       content = content + "</li></div>"
       $("#gene-names").html(content)
    })
    .append("text")
    .attr("dy", ".75em")
    .attr("y", -12)
    .attr("x", (x(data[0].dx) - x(0)) / 2)
    .attr("text-anchor", "middle")
    .text(function(d) { return formatCount(d.y); });


$('#gene-name').bind("keypress", {}, keypressSearch);

function keypressSearch(e) {
    var code = (e.keyCode ? e.keyCode : e.which);
    if (code == 13) { //Enter keycode                
        e.preventDefault();
        doSearch();
    }
};


function doSearch() {
  var gene_name = $("#gene-name").val();

  // First ensure it's not a common name or alias
  if (gene_name in aliases_lookup) {
      gene_name = aliases_lookup[gene_name]
  } else if (gene_name in common_names_lookup) {
      gene_name = common_names_lookup[gene_name]
  }
  
  // Most gene names are uppercase
  gene_name = gene_name.toUpperCase() 

  // Get the bar for the gene from the lookup
  if (gene_name in lookup) {

      var bar_value = lookup[gene_name];
      var bar_id = $(".value-" + bar_value)

      // Restore colors to original values
      $.each($(".histbar"), function(i, e){
         $(e).attr("fill", $(e).attr("data-fill"));
      })

      // Then make selected red!
      var bar = $(bar_id);
      bar.attr("fill", "red");

      // Tell the user in case they can't see it
      $("#gene-detail").html("Gene <a href='/datasets/genes?q=" + gene_name + "'>" + gene_name + "</a> has value: " + bar_value + ".")

  } else {
      $("#gene-detail").html("Gene "+ gene_name + " is not in this dataset.")
  }
}

// Find the gene when the user selects
$('input.typeahead').on('typeahead:selected', function(event, selection) {
  doSearch();
});


$(document).ready(function(){
    var alias_list = [{% for alias in aliases %}"{{ alias.1 }}"{% if forloop.last %}{% else %},{% endif %}{% endfor %}]
    var common_list = [{% for alias in common_list %}"{{ alias.1 }}"{% if forloop.last %}{% else %},{% endif %}{% endfor %}]

    var genes = $.merge(Object.keys(lookup), alias_list, common_list)
   
    // Constructing the suggestion engine
    var genes = new Bloodhound({
        datumTokenizer: Bloodhound.tokenizers.whitespace,
        queryTokenizer: Bloodhound.tokenizers.whitespace,
        local: genes
    });
    
    // Initializing the typeahead
    $('.gene-search').typeahead({
        hint: true,
        highlight: true, /* Enable substring highlighting */
        minLength: 1 /* Specify minimum characters required for showing suggestions */
    },
    {
        name: 'genes',
        source: genes
    });
});
</script>
