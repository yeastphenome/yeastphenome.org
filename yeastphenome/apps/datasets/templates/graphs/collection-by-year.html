<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.min.js"></script>
<canvas id="collection-by-year-chart"></canvas>
<script>
var ctx = document.getElementById("collection-by-year-chart");
var collectionChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [{% for year,count in collection_yearly_counts.counts.items %}"{{ year }}"{% if forloop.last %}{% else %},{% endif %}{% endfor %}],
    datasets: [{
      label: 'Yearly Counts',
      data: [{% for year, count in collection_yearly_counts.counts.items %}{{ count }}{% if forloop.last %}{% else %},{% endif %}{% endfor %}],
      borderColor: "rgba(255, 159, 64, 1.0)",
      backgroundColor: "rgba(255, 159, 64, 0.2)",
     },
     {
      label: 'Accumulated Counts',
      data: [{% for year, count in collection_yearly_counts.summed.items %}{{ count }}{% if forloop.last %}{% else %},{% endif %}{% endfor %}],
      borderColor: "rgba(153, 102, 255, 1.0)",
      backgroundColor: "rgba(153, 102, 255, 0.2)",
      fill: false
     }]
  },
  options: {
    responsive: true,
    title: {
      display: true,
      text: 'Dataset Counts for Collection {{ collection.name }}'
    },
    tooltips: {
      callbacks: {
        title: function (tti, data) {
          return data.labels[tti[0].index];
        }
      }
    },
    scales: {
      xAxes: [{
        categoryPercentage: 1.0,
        barPercentage: 1.0,
        tooltipFormat:'MM/DD/YYYY',
        type: 'time',
        time: {
          unit: 'year'
        },
        scaleLabel: {
          display: true,
          labelString: 'Date'
        }
      }],
      yAxes: [{
        scaleLabel: {
          display: true,
          labelString: 'Number of Datasets'
        }
      }]
    }
  }
});
</script>
