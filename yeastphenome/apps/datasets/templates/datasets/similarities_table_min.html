{% if similarities %}
    <table id="{{ table_id }}" class="table mt-3">
        <thead>
        <tr>
            <th scope="col" class="col-md-8">Dataset name</th>
            <th scope="col">Correlation (mean &#177; std. dev.)</th>
            <th scope="col">Percentile</th>
        </tr>
        </thead>
        <tbody>
        {% for similarity in similarities %}
            <tr>
                <td><a href="{% url 'datasets:detail' similarity.dataset2_id %}">{{ similarity.dataset2_name }}</a></td>
                <td>{{ similarity.score|floatformat:2 }} &#177; {{ similarity.pvalue|floatformat:2 }}</td>
                <td>{{ similarity.percentile|floatformat:2 }}%</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endif %}
