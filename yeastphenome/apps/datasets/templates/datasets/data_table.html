{% if datasets %}
<style>
    .tablesorter thead .disabled {
        display: none;
    }
</style>
<table id="{{ table_id }}" class="table table-condensed table-hover dt-body-center" width="100%">
    <thead>
    <tr>
        <th>Dataset Name</th>
        <th>Normalized Phenotypic Score</th>
    </tr>
    </thead>
    <tbody id="papersTableBody">
    {% for d in datasets %}
    <tr>
        <td class="dt-center"><a href="{% url 'datasets:dataset_detail' d.dataset_id %}">{{ d.dataset.name }}</a></td>
        <td class="dt-center">{{ d.valuez|floatformat:2 }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
<a class="btn btn-primary" type="button" href="{% url 'genes:download_gene_scores' gene.id %}">Download now</a>
<a class="btn btn-success" type="button" href="{% url 'genes:datasets' gene.id %}">View all</a>
{% endif %}
