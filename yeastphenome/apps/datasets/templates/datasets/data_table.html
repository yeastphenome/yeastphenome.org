{% if datasets %}
<style>
    .tablesorter thead .disabled {
        display:none;
    }
</style>
<form action="{% url 'datasets:download' %}" method="get">
    <table id="{{ table_id }}" class="table table-condensed table-hover" width="100%">
        <thead><tr>
        <th>Dataset Name</th>
        <th>Phenotypic Scores</th></tr>
        </thead>
        <tbody id="papersTableBody">
        {% for d in datasets %}<tr>
            <td class="col-md-5"><a href="/datasets/{{ d.dataset.id }}/">{{ d.dataset.name }}</a></td>
            <td class="col-md-5">{{ d.value|floatformat:1 }}</td>
        </tr>{% endfor %}
        </tbody>
    </table>
</form><a><button style="padding-right:5px" class="dataset_download_gene btn btn-info" type="button" class="btn btn-default">Download all</button></a><a href="{% url 'genes:datasets' gene.systematic_name %}"><button type="button" class="btn btn-default">View all</button></a>{% endif %}

<script language="JavaScript">
function toggle(source) {
  checkboxes = document.getElementsByClassName('dataset');
  for(var i=0, n=checkboxes.length;i<n;i++) {
    if(!checkboxes[i].disabled) {
        checkboxes[i].checked = source.checked;
    }
  }
  btn = document.getElementById('dataset_download');
  btn.disabled = !source.checked;
}
</script>

<script language="JavaScript">
var chkbxs = $('tbody .dataset');
chkbxs.change(function () {
    $('#dataset_download').prop('disabled', chkbxs.filter(':checked').length < 1);
});
chkbxs.change();
</script>
