{% if datasets %}
<style>
    .tablesorter thead .disabled {
        display:none;
    }
</style>
    <table id="{{ table_id }}" class="table table-condensed table-hover" width="100%">
        <thead><tr>
        <th style="text-align:left">Gene Name</th>
        <th style="text-align:left">Normalized Phenotypic Score</th></tr>
        </thead>
        <tbody id="papersTableBody">
        {% for d in datasets %}<tr>
            <td class="col-md-5"><a href="/genes/{{ d.3 }}/">{{ d.1 }} / {{ d.0 }}</a></td>
            <td class="col-md-5">{{ d.2|floatformat:1 }}</td>
        </tr>{% endfor %}
        </tbody>
    </table>
<a href="/datasets/download/?{{ dataset.id }}=on"><button style="margin-right:5px" type="button" class="btn btn-info">Download all</button></a>
<a href="{% url 'datasets:dataset_plot' dataset.id %}"><button type="button" class="btn btn-success">View all</button></a>

{% endif %}
