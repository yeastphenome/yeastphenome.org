{% if datasets %}
<style>
    .tablesorter thead .disabled {
        display:none;
    }
</style>
    <table id="{{ table_id }}" class="table table-condensed table-hover" width="100%">
        <thead><tr>
        <th style="text-align:left">Gene Name</th>
        <th style="text-align:left">Normalized Phenotypic Score</th></tr>
        </thead>
        <tbody id="papersTableBody">
        {% for d in datasets %}
        <tr>
            <td class="dt-center"><a href="/genes/{{ d.gene.id }}/">{{ d.gene }}</a></td>
            <td class="dt-center">{{ d.valuez|floatformat:2 }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
<a class="btn btn-primary" role="button" href="/datasets/download/?{{ dataset.id }}=on">Download now</a>
<a class="btn btn-success" role="button" href="{% url 'datasets:dataset_plot' dataset.id %}">View all</a>

{% endif %}
