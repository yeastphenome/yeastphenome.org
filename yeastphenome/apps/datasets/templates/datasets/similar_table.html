<table id="{{ table_id }}" class="table table-condensed table-hover" width="100%">
    <thead>
    <tr>
        <th style="text-align:left" with="33%">Dataset Name</th>
        <th style="text-align:left" width="33%">Correlation Mean</th>
        <th style="text-align:left" width="33%">Correlation Std. Dev.</th>
    </tr>
    </thead>
    <tbody>
    {% for sim in scores %}
    <tr>
        <td><a href="{% url 'datasets:dataset_detail' sim.dataset2_id %}">{{ sim.dataset2 }}</a></td>
        <td>{{ sim.score|floatformat:2 }}</td>
        <td>{{ sim.pvalue|floatformat:2 }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>

<a class="btn btn-primary btn-download btn-sm" style="padding-right:5px" href="{% url 'datasets:download_dataset_similarities' dataset.id %}" role="button">Download now</a>
<a class="btn btn-success btn-download btn-sm" href="{% url 'datasets:similar_dataset_table' dataset.id %}" role="button">View all</a>
