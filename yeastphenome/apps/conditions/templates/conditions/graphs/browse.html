{% extends "base/wide.html" %}
{% block title %}{{ object|capfirst }} / Experimental conditions / {{ SITE_NAME }}{% endblock %}
{% block container %}
<style>
rect {
  cursor: pointer;
}

svg {
  font: 10px sans-serif;
  float: left;
  padding-left:30px;
}
</style>
<div class="row" style="padding-left:30px; padding-bottom:20px">
    <div class="col-md-12">
        <h1>Browse Conditions</h1>
        <small>Top 100 By number of associated datasets</small>
	<form style='padding-top:10px'>
	  <label><input type="radio" name="mode" value="datasets" checked> Datasets</label>
	  <label><input type="radio" name="mode" value="papers"> Papers</label>
	</form>
    </div>
</div>
<div class="row" style="margin-bottom:200px">
    <div class="col-md-12">
        <svg width="1400" height="900"></div>
    </div>
</div>
<script src="https://d3js.org/d3.v4.min.js"></script>
<script>
// {packageName: name, className: node.name, value: node.size});
nodes = [{% for entry in data %}{% if entry.name != "standard" %}{"name": "{{ entry.name }}", "size": {{entry.number_of_datasets}}, "uid": {{ entry.id }}, "papers": {{ entry.number_of_papers }} }{% if forloop.last %}{% else %},{% endif %}{% endif %}{% endfor %}]
    
var svg = d3.select("svg"),
    width = +svg.attr("width"),
    height = +svg.attr("height");

var fader = function(color) { return d3.interpolateRgb(color, "#fff")(0.2); },
    color = d3.scaleOrdinal(d3.schemeCategory20.map(fader)),
    format = d3.format(",d");

var treemap = d3.treemap()
    .tile(d3.treemapResquarify)
    .size([width, height])
    .round(true)
    .paddingInner(1);

  var data = {"name": "root", "children": nodes}
  
  var root = d3.hierarchy(data)
      .eachBefore(function(d) { d.data.id = (d.parent ? d.parent.data.id + "." : "") + d.data.name; })
      .sum(sumBySize)
      .sort(function(a, b) { return b.height - a.height || b.value - a.value; });

  treemap(root);

  var cell = svg.selectAll("g")
    .data(root.leaves())
    .enter().append("g")
      .attr("transform", function(d) { return "translate(" + d.x0 + "," + d.y0 + ")"; });

  cell.append("rect")
      .attr("id", function(d) { return d.data.id; })
      .attr("width", function(d) { return d.x1 - d.x0; })
      .attr("height", function(d) { return d.y1 - d.y0; })
      .attr("fill", function(d) { return color(d.value); })
      .on("click", function(d){ console.log(d); document.location = "/conditions/" + d.data.uid});

  cell.append("clipPath")
      .attr("id", function(d) { return "clip-" + d.data.id; })
    .append("use")
      .attr("xlink:href", function(d) { return "#" + d.data.id; });

  cell.append("text")
      .attr("clip-path", function(d) { return "url(#clip-" + d.data.id + ")"; })
    .selectAll("tspan")
      .data(function(d) { return d.data.name.split(/(?=[A-Z][^A-Z])/g); })
    .enter().append("tspan")
      .attr("x", 4)
      .attr("y", function(d, i) { return 13 + i * 10; })
      .text(function(d) { return d; });

  cell.append("title")
      .text(function(d) { 
         var choice = $("input[name='mode']:checked").val();
         return d.data.id + "\n" + format(d.value) + " " + choice; 
       });

  d3.selectAll("input")
      .data([sumBySize, sumByCount], function(d) { return d ? d.name : this.value; })
      .on("change", changed);

  var timeout = d3.timeout(function() {
    d3.select("input[value=\"sumByCount\"]")
        .property("checked", true)
        .dispatch("change");
  }, 2000);

  $("input[name='mode']").change(function(){
    choice = $(this).val()
    console.log(choice)

    if (choice=="datasets") {
        treemap(root.sum(sumBySize));
    } else {
        treemap(root.sum(sumByPapers));
    }

    cell.transition()
        .duration(750)
        .attr("transform", function(d) { return "translate(" + d.x0 + "," + d.y0 + ")"; })
      .select("rect")
        .attr("width", function(d) { return d.x1 - d.x0; })
        .attr("height", function(d) { return d.y1 - d.y0; });

  })

  function changed(sum) {
    console.log(sum);
    timeout.stop();

    treemap(root.sum(sum));

    cell.transition()
        .duration(750)
        .attr("transform", function(d) { return "translate(" + d.x0 + "," + d.y0 + ")"; })
      .select("rect")
        .attr("width", function(d) { return d.x1 - d.x0; })
        .attr("height", function(d) { return d.y1 - d.y0; });
  }

function sumByCount(d) {
  return d.children ? 0 : 1;
}

function sumByPapers(d) {
  return d.papers;
}

function sumBySize(d) {
  return d.size;
}
</script>
{% endblock %}
