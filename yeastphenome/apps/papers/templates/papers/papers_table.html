{% load my_filters %}
<table id="papersTable" class="tablesorter table table-striped" width="100%">
    <thead>
        <tr>
            <th class="text-nowrap" width="30%">First Author~Last Author, Year</th>
            <th width="35%">Phenotypes</th>
            <th width="35%">Conditions</th>
        </tr>
    </thead>
    <tbody id="papersTableBody">
        {% for paper in papers_list %}
        <tr>
            <td class="text-nowrap"><a href="{% url 'papers:detail' paper.pk  %}">{{ paper }}</a></td>
            <td>{{ paper.phenotypes_list_as_str }}</td>
            <td>{{ paper.conditiontypes_list_as_str }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
