<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.min.js"></script>

<canvas id="papers-by-year-chart"></canvas>
<script>
    var ctx = document.getElementById("papers-by-year-chart");
    var papersChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [{% for year,count in paper_counts.items %}"{{ year }}"{% if forloop.last %}{% else %},{% endif %}{% endfor %}],
            datasets: [{
                label: 'Number of papers per year',
                data: [{% for year, count in paper_counts.items %}{
                        t: new Date("{{ year }}"),
                        y: {{ count }}
                        }{% if forloop.last %}{% else %},{% endif %}
                    {% endfor %}],
                backgroundColor: 'rgb(36, 113, 163)',
                borderWidth: 0
            }
            ]
        },
        options: {
            responsive: true,
            legend: {
                display: false
            },
            hover: {
                onHover: function(e) {
                    var point = this.getElementAtEvent(e);
                    if (point.length) e.target.style.cursor = 'pointer';
                    else e.target.style.cursor = 'default';
                }
            },
            onClick:function(e, items){
                if (items.length == 0) return; //Clicked outside any bar.
                var activePointLabel = this.getElementsAtEvent(e)[0]._model.label;
                document.location = "/search/?q=" + activePointLabel + "&tab=papers"
            },
            tooltips: {
                callbacks: {
                    title: function (tti, data) {
                        return data.labels[tti[0].index];
                    }
                }
            },
            scales: {
                xAxes: [{
                    type: 'category',
                    offset: true,
                    ticks: {
                        source: 'data',
                    },
                    gridLines: {
                        drawTicks: true
                    },
                    scaleLabel: {
                        display: true,
                        labelString: 'Publication year'
                    },
                }],
                yAxes: [{
                    scaleLabel: {
                        display: true,
                        labelString: 'Number of papers'
                    }
                }]
            }
        }
    });
</script>
